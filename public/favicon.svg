<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5500cc"/>
      <stop offset="70%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
  </defs>
  <!-- Track arc -->
  <path d="M 14,92 A 46,46 0 0 1 106,92" stroke="#1e1e1e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Gradient arc -->
  <path d="M 14,92 A 46,46 0 0 1 106,92" stroke="url(#ag)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="144 200"/>
  <!-- Tick marks -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(0 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(18 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(36 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(54 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(72 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(90 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(108 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(126 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(144 60 92)"/>
    <line x1="14" y1="92" x2="19" y2="84" transform="rotate(162 60 92)"/>
  </g>
  <!-- Red zone arc -->
  <path d="M 97,65 A 46,46 0 0 1 106,92" stroke="#ff3333" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- Needle -->
  <g filter="url(#g)">
    <line x1="60" y1="92" x2="100" y2="72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="92" x2="53" y2="96" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Hub -->
  <circle cx="60" cy="92" r="5" fill="#863bff"/>
  <circle cx="60" cy="92" r="2.5" fill="#fff"/>
</svg>
